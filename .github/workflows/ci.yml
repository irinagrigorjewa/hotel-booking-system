name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
    branches: [develop, master, main]

permissions:
  contents: read

env:
  CI: "true"
  DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/hotel_booking_test
  SECRET_KEY: ci-only-secret
  CORS_ORIGINS: http://localhost:5173
  UPLOAD_DIR: /tmp/hotel-booking-uploads

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check frontend types
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Lint backend
        run: ruff check .
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:run
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hotel_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d hotel_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
        working-directory: backend

  build:
    needs: [lint, frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install and build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Validate backend package
        run: python -m compileall -q app && python -c "from app.main import app"
        working-directory: backend

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 -t hotel-booking-frontend:ci ./frontend

      - name: Build backend image
        run: docker build -t hotel-booking-backend:ci ./backend
